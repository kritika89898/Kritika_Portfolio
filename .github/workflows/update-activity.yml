name: Update LeetCode activity

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LeetCode activity
        run: node scripts/fetch-activity.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update activity data"
            git push
          fi
